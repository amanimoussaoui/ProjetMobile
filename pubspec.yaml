name: petconnect
description: A fun pet adoption app called PetConnect
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  animated_text_kit: ^4.2.2
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.2.0
  avatar_view: ^2.0.0
  path_provider: ^2.1.2
  email_validator: ^2.1.17
  mailer: ^6.0.1
  uuid: ^4.2.1
  http: ^1.1.2
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  zxcvbn: ^0.1.3
  recaptcha_verifier: ^0.3.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/logo.png
    - assets/images/pett.png



